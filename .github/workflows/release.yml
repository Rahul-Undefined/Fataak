# Builds the Windows zip and publishes it as a GitHub Release whenever a version tag is pushed:
#   npm version minor        (bumps package.json, commits, tags v1.2.0)
#   git push --follow-tags
# Installed copies of FATAAK find the release through Settings → Check for updates and install it themselves.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:zip
      - name: check that the tag matches package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match package.json version $v" }
      - uses: softprops/action-gh-release@v2
        with:
          files: release/FATAAK-*-x64.zip
          generate_release_notes: true
